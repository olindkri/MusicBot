services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: musicbot-lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xms512M -Xmx2G -XX:+UseG1GC -XX:MaxGCPauseMillis=50
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-changeme}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - YOUTUBE_OAUTH_REFRESH_TOKEN=${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/Lavalink/plugins
      - ./assets/intros:/opt/Lavalink/intros:ro
    networks:
      - musicbot

  bot:
    build: .
    container_name: musicbot-bot
    restart: unless-stopped
    depends_on:
      - lavalink
    env_file: .env
    networks:
      - musicbot

networks:
  musicbot:
    driver: bridge
